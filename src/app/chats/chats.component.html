<div class="chat-container">

  <!-- Top bar -->
  <header class="toolbar">
    <img src="https://images.squarespace-cdn.com/content/v1/58a1a2bb9f745664e6b41612/1597057412838-T3UTOLKZII99Q0OUGPK5/Sauti+Ya+Mtaa.jpg"
         alt="Tubonge Logo" class="logo">
    <button type="button" (click)="goToLogin()" class="logout-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 17l5-5-5-5M20 12H9M13 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Logout</span>
    </button>
  </header>

  <div class="chat-body">

    <!-- Sidebar: user list -->
    <aside class="user-panel">
      <h2 class="user-panel-title">Users</h2>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" [(ngModel)]="userSearchTerm" placeholder="Search users...">
      </div>

      <ul class="user-list">
        <li *ngFor="let user of filteredUsers"
            class="user-item"
            [class.active]="user._id === selectedUserId"
            (click)="selectUser(user)">
          <div class="user-item-row">
            <span class="user-name">
              <span class="status-dot" [class.online]="isOnline(user._id)"></span>
              {{ user.username }}
            </span>
            <span class="unread-badge" *ngIf="getUnreadCount(user._id) > 0">{{ getUnreadCount(user._id) }}</span>
          </div>
          <p class="user-last-message" *ngIf="getLastMessage(user._id)">{{ getLastMessage(user._id) }}</p>
        </li>
        <li *ngIf="filteredUsers.length === 0" class="user-list-empty">No users found</li>
      </ul>
    </aside>

    <!-- Conversation -->
    <section class="conversation">

      <div class="conversation-header" *ngIf="selectedUser._id">
        <div>
          <span class="conversation-username">{{ selectedUser.username }}</span>
          <span class="conversation-status" [class.online]="isOnline(selectedUser._id)">
            {{ isOnline(selectedUser._id) ? 'Online' : 'Offline' }}
          </span>
        </div>
      </div>

      <div class="messages" *ngIf="selectedUser._id; else emptyState">
        <div *ngFor="let message of messages"
             class="message-row"
             [ngClass]="{ 'from-them': message.sender === selectedUserId, 'from-me': message.sender === currentUser._id }">
          <div class="bubble">
            <p class="bubble-text">{{ message.message }}</p>
          </div>
        </div>
      </div>

      <ng-template #emptyState>
        <div class="empty-state">
          <svg viewBox="0 0 120 90" width="90" height="70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="8" width="62" height="42" rx="14" fill="#e8e8e8"/>
            <circle cx="24" cy="29" r="3" fill="#9a9a9a"/>
            <circle cx="35" cy="29" r="3" fill="#9a9a9a"/>
            <circle cx="46" cy="29" r="3" fill="#9a9a9a"/>
            <rect x="46" y="38" width="70" height="46" rx="16" fill="#d6ec4f"/>
            <circle cx="70" cy="61" r="3" fill="#4a5a1f"/>
            <circle cx="81" cy="61" r="3" fill="#4a5a1f"/>
            <circle cx="92" cy="61" r="3" fill="#4a5a1f"/>
          </svg>
          <h3>Start your conversation</h3>
          <p>Send a message to start chatting</p>
        </div>
      </ng-template>

      <footer class="chat-footer" *ngIf="selectedUser._id">
        <textarea [(ngModel)]="newMessage" placeholder="Type your message..." rows="1"
                  (keydown.enter)="$event.preventDefault(); sendMessage()"></textarea>
        <button type="button" (click)="sendMessage()" class="send-btn" [disabled]="!newMessage.trim()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Send</span>
        </button>
      </footer>

    </section>

  </div>

</div>
